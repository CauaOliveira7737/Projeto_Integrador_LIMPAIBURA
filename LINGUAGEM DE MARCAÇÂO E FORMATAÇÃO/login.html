<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>LimpaIbura - Entrar</title>
</head>
<body>
    <main class="g-15_login">
        <img class="g-15_login-imagem" src="img/ilustracao_login_fundo.png" >

        <div class="g-15_login-form">
            <a class="g-15_voltar" href="index.html">
                <img class="g-15_voltar-seta" src="img/icon_seta-esquerda-verde.png" alt="">
                <p class="g-15_voltar-texto">Voltar para o início</p>
            </a>

            <h1 class="g-15_titulo">Bem-vindo de volta.</h1>
            <p class="g-15_subtitulo">Entre na sua conta para acompanhar suas denúncias.</p>

            <p class="g-15_label-email">E-mail ou telefone</p>
            <input class="g-15_input" type="text" placeholder="Digite seu e-mail ou telefone">

            <p class="g-15_label-senha">Senha</p>
            <div class="g-15_senha">
                <input class="g-15_senha-input" type="password" placeholder="Digite sua senha">
                <img class="g-15_senha-icone" src="img/icon_olho.png" alt="Mostrar senha">
            </div>

            <div class="g-15_opcoes">
                <div class="g-15_manter">
                    <input class="g-15_manter-caixa" type="checkbox">
                    <p class="g-15_manter-texto">Manter conectado</p>
                </div>
                <a class="g-15_esqueci" href="#">Esqueci minha senha</a>
            </div>

            <button class="g-15_botao" type="button">Entrar na conta<img class="g-15_botao-seta" src="img/icon_seta-direita.png" alt=""></button>

            <div class="g-15_cadastro">
                <p class="g-15_cadastro-texto">Ainda não tem uma conta?</p>
                <a class="g-15_cadastro-link" href="cadastro.html">Cadastre-se</a>
            </div>

            <hr class="g-15_linha">

            <p class="g-15_consulta-titulo">Só quer consultar informações?</p>
            <a class="g-15_consulta-link" href="coleta_e_descarte.html">
                <p class="g-15_consulta-link-texto">Coleta e mapa público não precisam de login.</p>
                <img class="g-15_consulta-link-seta" src="img/icon_seta-para-cima-direita.png" alt="">
            </a>
        </div>
    </main>
</body>
</html>
